<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Griffel integration lab</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; font: 15px/1.6 system-ui, sans-serif; color: #162238; background: #f4f6fa; }
      main { max-width: 1240px; margin: auto; }
      h1 { margin: 0; font-size: clamp(30px, 4vw, 44px); line-height: 1.12; letter-spacing: -0.035em; }
      h2 { font-size: 20px; margin: 0; }
      p { max-width: 100ch; }
      code, pre { font-family: ui-monospace, monospace; font-size: 12px; }
      button { padding: 8px 14px; cursor: pointer; }
      .grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; margin-top: 20px; }
      .card { padding: 22px; border: 1px solid #d7deea; border-radius: 14px; background: white; box-shadow: 0 4px 16px #1e33500a; }
      iframe { width: 100%; height: 330px; border: 0; display: block; }
      body.case-page { background: white; padding: 12px; }
      .track { background: #e9eef5; padding: 8px; margin: 12px 0; }
      .probe { min-height: 36px; background: #244c92; color: white; white-space: nowrap; }
      .expected-width { width: 137px; border-bottom: 3px dashed #1d6e48; margin-top: 8px; font-size: 12px; }
      .result { padding: 8px; border-left: 4px solid #315e93; background: #edf4ff; }
      .result.missing { border-color: #ad2c2c; background: #fff0f0; }
      .result.bypass { border-color: #976000; background: #fff7e5; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0; }
      .note { padding: 12px; background: #fff4d6; }
      .section-title { font-size: 24px; margin-top: 36px; }
      .site-header { display: flex; align-items: center; gap: 28px; min-height: 62px; margin-bottom: 24px; padding: 0 18px; border: 1px solid #d9e0eb; border-radius: 14px; background: #fff; box-shadow: 0 4px 16px #1e335008; }
      .site-brand { color: #182b49; font-weight: 750; letter-spacing: -.02em; text-decoration: none; white-space: nowrap; }
      .site-header nav { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 0; }
      .site-header nav a { padding: 8px 12px; border-radius: 8px; color: #53637b; text-decoration: none; }
      .site-header nav a:hover, .site-header nav a:focus-visible { color: #173a72; background: #f0f4fa; }
      .site-header nav a[aria-current="page"] { color: #173a72; background: #eaf1fc; font-weight: 650; }
      .nav-context { margin-left: auto; color: #6b778b; font-size: 13px; }
      .page-hero { margin: 0 0 22px; padding: clamp(24px, 5vw, 48px); border: 1px solid #dce4f0; border-radius: 18px; background: linear-gradient(125deg, #fff 28%, #edf3fc 100%); box-shadow: 0 8px 26px #1e33500a; }
      .page-hero p:not(.eyebrow) { max-width: 74ch; margin: 14px 0 0; color: #52627a; font-size: 16px; }
      .eyebrow { margin: 0 0 10px; color: #315d9c; font-size: 12px; font-weight: 750; letter-spacing: .11em; text-transform: uppercase; }
      .text-link { display: inline-flex; gap: 8px; align-items: center; margin-top: 20px; color: #244c92; font-weight: 650; text-decoration: none; }
      .text-link:hover { text-decoration: underline; }
      .playground-hero h1 { max-width: 18ch; }
      .docs-hero h1 { max-width: 24ch; }
      .documentation-content { display: grid; gap: 18px; min-width: 0; }
      .documentation-content > * { min-width: 0; }
      .documentation-content > .intro-help, .documentation-content > .conflict-guide, .documentation-content > .note { padding: 20px; border: 1px solid #dce2ec; border-radius: 14px; background: white; }
      .documentation-content > .intro-help h2 { font-size: 22px; }
      .documentation-content > .conflict-guide { background: #fff; }
      .documentation-content .participant-responsibilities article { border-color: #dce2ec; border-radius: 10px; }
      .documentation-content .mechanism-flow li { border-color: #dce2ec; border-radius: 10px; }
      .documentation-content table th, .documentation-content table td { border-color: #dce2ec; }
      .documentation-content code { overflow-wrap: anywhere; }
      :focus-visible { outline: 3px solid #6c9be0; outline-offset: 2px; }
      .extraction-frame { height: 1180px; }
      .extraction-page p { font-size: 12px; }
      .extraction-page *, .extraction-page *::before, .extraction-page *::after { transition: none !important; animation: none !important; }
      .fluent-card { display: grid; gap: 8px; padding: 12px; border: 1px solid #bac7d8; border-radius: 8px; margin: 10px 0; }
      .fluent-person { display: flex; gap: 10px; align-items: center; }
      .fluent-call { margin-left: auto; display: flex; }
      .fluent-submit { display: grid; }
      .fluent-actions { display: grid; grid-template-columns: minmax(0, 1fr) minmax(137px, 1fr); gap: 8px; }
      .three-actor-frame { height: 1700px; margin-top: 12px; border: 1px solid #bac7d8; }
      .actor-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
      .actor-grid:has(> section[hidden]) { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .walkthrough { margin: 18px 0; }
      .walkthrough-frame { height: 730px; }
      .actor-outcomes { margin: 0; }
      .actor-outcomes { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; font-size: 13px; }
      .actor-outcomes dt { font-weight: 600; }
      .actor-outcomes dd { margin: 0; }
      .load-order { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; list-style: none; padding: 0; margin: 12px 0; }
      .load-order li { display: flex; align-items: center; gap: 8px; }
      .load-order li + li::before { content: "→"; color: #52637a; }
      .scenario-takeaway { border-left: 3px solid #315e93; padding-left: 10px; }
      .participant-responsibilities { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
      .participant-responsibilities article { min-width: 0; padding: 12px; border: 1px solid #bac7d8; border-radius: 6px; background: white; }
      .participant-responsibilities h3 { margin-top: 0; }
      .mechanism-flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; list-style: none; padding: 0; }
      .mechanism-flow li { padding: 12px; border: 1px solid #bac7d8; border-radius: 6px; background: #edf4ff; }
      .mechanism-flow span { display: block; margin-top: 6px; }
      .table-scroll { overflow-x: auto; }
      .conflict-guide table { border-collapse: collapse; width: 100%; margin: 12px 0; text-align: left; }
      .conflict-guide caption { text-align: left; font-weight: 600; padding-bottom: 8px; }
      .conflict-guide th, .conflict-guide td { border: 1px solid #bac7d8; padding: 10px; vertical-align: top; }
      .conflict-guide thead { background: #edf4ff; }
      .conflict-guide pre { padding: 12px; background: #e9eef5; }
      [data-rule-trace] code { overflow-wrap: anywhere; }
      .walkthrough-page #actor-evidence { display: none; }
      summary { cursor: pointer; font-weight: 600; }
      details.note, .host-settings, .intro-help { padding: 12px; margin: 12px 0; }
      .three-actor-page *, .three-actor-page *::before, .three-actor-page *::after { transition: none !important; animation: none !important; }
      select { padding: 8px; max-width: 100%; margin: 0 12px 0 0; }
      @media (max-width: 650px) {
        .mechanism-flow, .participant-responsibilities { grid-template-columns: 1fr; }
        .actor-grid, .actor-grid:has(> section[hidden]) { grid-template-columns: 1fr; }
        .walkthrough-frame { height: 1800px; }
        .site-header { gap: 12px; flex-wrap: wrap; padding: 12px 14px; }
        .nav-context { margin-left: 0; }
      }
      @media (max-width: 500px) { .grid { grid-template-columns: 1fr; } body { padding: 12px; } .site-header nav { width: 100%; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/app.js"></script>
  </body>
</html>
